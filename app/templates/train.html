<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Model</title>
</head>
<body>
    <h1>Train Model for {{ project_name }}</h1>
    <form method="POST">
        <label for="version">YOLO Version:</label>
        <input type="text" name="version" id="version" required><br>

        <label for="epochs">Epochs:</label>
        <input type="number" name="epochs" id="epochs" required><br>

        <label for="batch_size">Batch Size:</label>
        <input type="number" name="batch_size" id="batch_size" required><br>

        <label for="learning_rate">Learning Rate:</label>
        <input type="number" step="0.0001" name="learning_rate" id="learning_rate" required><br>

        <label for="image_size">Image Size:</label>
        <input type="number" name="image_size" id="image_size" required><br>

        <button type="submit">Train Model</button>
    </form>
</body>
</html>
